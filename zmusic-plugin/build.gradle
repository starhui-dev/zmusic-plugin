plugins {
    alias(libs.plugins.shadow)
}

version = '2.14.0'

java {
    // 产物面向 Java 8，但要打包 Java 21 的高版本 Paper NMS 模块，测试也运行在 Java 21 上，因此不按 JVM 版本筛选依赖变体
    disableAutoTargetJvm()
}

dependencies {
    compileOnly 'ink.ptms:nms-all:1.0.0'

    implementation(project(":zmusic-nms:zmusic-nms-core"))
    implementation(project(":zmusic-nms:zmusic-nms-legacy"))
    implementation(project(":zmusic-nms:zmusic-nms-1.17"))
    implementation(project(":zmusic-nms:zmusic-nms-1.18"))
    implementation(project(":zmusic-nms:zmusic-nms-1.19"))
    implementation(project(":zmusic-nms:zmusic-nms-1.20"))
    // 显式打包 Spigot 映射的 reobf 产物，由 Paper 加载时重映射
    implementation(project(path: ":zmusic-nms:zmusic-nms-1.21.4", configuration: "reobf"))
    implementation(project(path: ":zmusic-nms:zmusic-nms-1.21.7", configuration: "reobf"))
    implementation(project(path: ":zmusic-nms:zmusic-nms-1.21.11", configuration: "reobf"))

    compileOnly libs.bungeecord
    compileOnly libs.velocity

    // Adventure API (Velocity/Paper 使用) - 仅编译时依赖，运行时由平台提供
    compileOnly libs.adventure.api
    compileOnly libs.adventure.text.serializer.legacy

    compileOnly libs.placeholderapi
    compileOnly libs.vault

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation libs.placeholderapi
    testImplementation libs.spigot
    testRuntimeOnly 'com.google.code.gson:gson:2.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

build {
    dependsOn shadowJar
}

processResources {
    inputs.property "version", project.version

    filesMatching("bungee.yml") {
        expand "version": project.version
    }

    filesMatching("plugin.yml") {
        expand "version": project.version
    }

    filesMatching("velocity-plugin.json") {
        expand "version": project.version
    }
}
